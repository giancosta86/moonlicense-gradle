buildscript {
    repositories {
        //TODO! Del this!
        mavenLocal()

        mavenCentral()
    }

    dependencies {
        classpath 'info.gianlucacosta.aurora:aurora:10.0.0-SNAPSHOT'
    }
}


apply plugin: 'groovy'
apply plugin: 'maven'
apply plugin: 'info.gianlucacosta.aurora'


group = 'info.gianlucacosta.moonlicense'
archivesBaseName = 'moonlicense-gradle'
version = '6.0.0-SNAPSHOT'

description = 'MoonLicense integration into the Gradle build process'


dependencies {
    compile localGroovy()

    compile gradleApi()

    compile 'info.gianlucacosta.moonlicense:moonlicense:4.0.0-SNAPSHOT'

    testCompile 'junit:junit:4.12'
}

aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
        url = 'http://gianlucacosta.info/'
    }
}
