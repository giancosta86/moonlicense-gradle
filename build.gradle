buildscript {
    repositories {
        maven {
            url 'https://dl.bintray.com/giancosta86/Hephaestus'
        }

        jcenter()
    }

    dependencies {
        classpath 'com.jfrog.bintray.gradle:gradle-bintray-plugin:1.7.3'
        classpath 'info.gianlucacosta.moonlicense:moonlicense-gradle:4.3'
        classpath 'info.gianlucacosta.aurora:aurora:8.0'
    }
}


apply plugin: 'groovy'
apply plugin: 'maven'
apply plugin: 'com.jfrog.bintray'
apply plugin: 'info.gianlucacosta.moonlicense'
apply plugin: 'info.gianlucacosta.aurora'


group = 'info.gianlucacosta.moonlicense'
archivesBaseName = 'moonlicense-gradle'
version = '5.0'

description = 'MoonLicense integration into the Gradle build process'

ext.facebookPage = "https://www.facebook.com/moonlicense"


dependencies {
    generatedCompile localGroovy()

    compile localGroovy()

    compile gradleApi()

    compile 'info.gianlucacosta.moonlicense:moonlicense:3.0'

    testCompile 'junit:junit:4.12'
}


moonLicense {
    license = apache2

    productInfo {
        productName = 'MoonLicense - Gradle'
        inceptionYear = 2015
        copyrightHolder = 'Gianluca Costa'
    }
}


aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
    }


    bintray {
        repo = 'Hephaestus'
        licenses = ['Apache-2.0']
        labels = ['licenses', 'notices', 'Gradle', 'plugin', 'extensible']
    }
}
